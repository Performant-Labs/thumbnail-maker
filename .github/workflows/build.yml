name: Build desktop apps

# Build Windows .exe and macOS .app. Runs on version tags (v1.2.3) and can be
# triggered manually. PyInstaller can't cross-compile, so each OS builds on its
# own runner.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on a tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ThumbnailMaker-windows
          - os: macos-latest
            artifact: ThumbnailMaker-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --clean --noconfirm ThumbnailMaker.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ThumbnailMaker.exe -DestinationPath ${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto preserves the .app bundle structure and resource forks.
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Thumbnail Maker.app" "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/**/*.zip
