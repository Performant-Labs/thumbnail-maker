name: Headless backend tests

# Prove the front/back split: the core backend and its public API are exercised
# with no display and no GUI toolkit. Runs on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Import core headlessly (no display, no tkinter)
        run: python -c "import core; print('core public API:', sorted(core.__all__))"

      - name: Run the test suite
        run: python -m pytest -q
