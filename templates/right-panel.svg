<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Photo: fills the left side. Edit width to move the seam; the panel
       below covers the right side. -->
  <rect id="photo" x="0" y="0" width="655" height="720"/>

  <!-- Right color panel. id="panel" lets the app override fill at render time;
       its fill here is just the default when no color is chosen. -->
  <rect id="panel" x="655" y="0" width="625" height="720" fill="#17263B"/>

  <!-- Title: shrinks and wraps to fit. font-size is the maximum. -->
  <text x="712" y="215"
        font-family="Playfair Display" font-weight="400" font-size="170"
        fill="#FFFFFF" text-anchor="start"
        data-fit="true" data-max-width="511" data-max-lines="2" data-line-height="1.6"
  >{{title}}</text>

  <!-- Subtitle: small, letter-spaced. -->
  <text x="715" y="640"
        font-family="Playfair Display" font-weight="500" font-size="33"
        fill="#7FB3C4" text-anchor="start" letter-spacing="6"
  >{{subtitle}}</text>
</svg>
