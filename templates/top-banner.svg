<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Photo: fills the frame below the banner. Cover-cropped into this box. -->
  <rect id="photo" x="0" y="232" width="1280" height="488"/>

  <!-- Top banner band. Change fill/height to restyle. -->
  <rect x="0" y="0" width="1280" height="232" fill="#8C3A2B"/>
  <!-- Thin accent line along the bottom edge of the banner. -->
  <rect x="0" y="226" width="1280" height="6" fill="#F0C9A0"/>

  <!-- Subtitle: small kicker above the title. -->
  <text x="62" y="66"
        font-family="Playfair Display" font-weight="600" font-size="28"
        fill="#F0C9A0" text-anchor="start" letter-spacing="6"
  >{{subtitle}}</text>

  <!-- Title: shrinks and wraps to fit the banner. font-size is the maximum. -->
  <text x="60" y="176"
        font-family="Playfair Display" font-weight="700" font-size="104"
        fill="#FFFFFF" text-anchor="start"
        data-fit="true" data-max-width="1160" data-max-lines="1" data-line-height="1.05"
  >{{title}}</text>
</svg>
